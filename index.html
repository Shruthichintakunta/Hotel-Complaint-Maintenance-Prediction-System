<!DOCTYPE html>
<html>
<head>
    <title>Hotel Complaint Maintenance Prediction System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Hotel Complaint Maintenance Prediction System</h1>
        <p>Manage complaints and predict maintenance issues efficiently</p>
    </header>

    <div class="container">
        <h2>Register Complaint</h2>

        <form>
            <label>Customer Name</label>
            <input type="text" placeholder="Enter customer name">

            <label>Room Number</label>
            <input type="number" placeholder="Enter room number">

            <label>Complaint Type</label>
            <select>
                <option>AC Issue</option>
                <option>Water Leakage</option>
                <option>Electrical Problem</option>
                <option>Furniture Damage</option>
                <option>Other</option>
            </select>

            <label>Description</label>
            <textarea rows="5" placeholder="Describe the issue"></textarea>

            <button type="submit">Submit Complaint</button>
        </form>
    </div>

    <footer>
        <p>© 2026 Hotel Complaint Maintenance Prediction System</p>
    </footer>

</body>
</html>
